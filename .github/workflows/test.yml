name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest pyflakes
      - name: Check for syntax / undefined-name errors
        run: pyflakes *.py tests/*.py
      - name: Run automated tests
        run: pytest -v
