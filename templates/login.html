{% extends "base.html" %}
{% block title %}Sign in · Eclaro Academy{% endblock %}
{% block body %}
<div class="login">
  <div class="login-card">
    <img class="login-logo" src="{{ url_for('static', filename='img/eclaro_logo.jpg') }}" alt="Eclaro Academy">
    <h1>Sign in</h1>

    {% if error %}
    <div class="flash err" role="alert">
      <span>{{ error }}</span>
    </div>
    {% endif %}

    <form method="post" action="{{ url_for('login') }}">
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" value="{{ username or '' }}" autocomplete="username" autocapitalize="none" spellcheck="false">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <div class="pw-wrap">
          <input type="password" id="password" name="password" autocomplete="current-password" required autofocus>
          <button type="button" class="pw-toggle" id="pwToggle" aria-controls="password" aria-pressed="false">Show</button>
        </div>
      </div>
      <button class="btn primary" type="submit">Sign in</button>
    </form>

    <p class="login-help">Students: leave the username empty and enter the student key.</p>
  </div>
</div>

<script>
  (function () {
    var btn = document.getElementById('pwToggle'), input = document.getElementById('password');
    btn.addEventListener('click', function () {
      var show = input.type === 'password';
      input.type = show ? 'text' : 'password';
      btn.textContent = show ? 'Hide' : 'Show';
      btn.setAttribute('aria-pressed', show ? 'true' : 'false');
    });
  })();
</script>
{% endblock %}
